<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svenska — trener słownictwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2521;
    --paper:#FBFBF8;
    --paper-2:#F3F2EC;
    --bg-1:#E7ECE3;
    --bg-2:#DCE6E4;
    --line:#CBD3C6;
    --line-soft:#DEE4D8;
    --red:#A8382B;
    --red-dark:#7E2A20;
    --red-soft:#F3E3DF;
    --blue:#1D4E6B;
    --blue-dark:#123448;
    --blue-soft:#DEE9EE;
    --gold:#B3860E;
    --gold-dark:#83640A;
    --gold-soft:#F3EAD2;
    --green:#3F7A5D;
    --green-dark:#2C5842;
    --green-soft:#E1EDE5;
    --muted:#5E6B65;
    --muted-2:#6B756E;
    --plum:#6B4A8A;
    --plum-dark:#4A3357;
    --plum-soft:#ECE3F0;
    --teal:#1D7A6B;
    --teal-dark:#123F38;
    --teal-soft:#DCEEEA;
    --shadow:0 1px 2px rgba(20,26,22,0.06), 0 8px 24px -12px rgba(20,26,22,0.18);
    --shadow-lg:0 4px 8px rgba(20,26,22,0.06), 0 24px 48px -20px rgba(20,26,22,0.28);
    --radius:18px;
    --radius-sm:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -8%, var(--bg-2), transparent 60%),
      radial-gradient(900px 460px at 110% 8%, var(--blue-soft), transparent 55%),
      var(--bg-1);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:20px 16px 64px;
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding:6px 4px 22px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand-mark{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand-mark .flag{
    display:inline-flex;
    width:22px;height:16px;
    border-radius:3px;
    background:var(--blue);
    position:relative;
    overflow:hidden;
    flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,0.08);
  }
  .brand-mark .flag::before{
    content:"";
    position:absolute;
    top:0;bottom:0;left:38%;
    width:22%;
    background:var(--gold);
  }
  .brand-mark .flag::after{
    content:"";
    position:absolute;
    left:0;right:0;top:42%;
    height:16%;
    background:var(--gold);
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(28px,5vw,36px);
    letter-spacing:-0.02em;
    margin:0;
    line-height:1;
  }
  .brand .subtitle{
    font-size:13px;
    color:var(--muted);
    margin:2px 0 0 32px;
  }
  .header-stats{
    display:flex;
    gap:10px;
    align-items:center;
    font-family:var(--font-mono);
    flex:none;
  }
  .streak-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 12px 7px 10px;
    font-size:13px;
    box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .streak-pill .n{font-weight:600; color:var(--red-dark);}
  .word-count-pill{
    display:none;
  }
  @media (min-width:560px){
    .word-count-pill{
      display:flex;
      align-items:center;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 12px;
      font-size:13px;
      color:var(--muted);
      box-shadow:var(--shadow);
      white-space:nowrap;
    }
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:4px 4px 14px;
    scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    color:var(--muted);
    background:transparent;
    border:1px solid transparent;
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .tab-btn:focus-visible, button:focus-visible, .chip:focus-visible, .gbtn:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }

  /* ---------- Category chips ---------- */
  .chiprow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 4px 18px;
  }
  .chip{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .chip.on{
    color:var(--ink);
    border-color:currentColor;
    box-shadow:var(--shadow);
  }
  .chip.on.c-verb{background:var(--blue-soft); border-color:var(--blue);}
  .chip.on.c-noun{background:var(--green-soft); border-color:var(--green);}
  .chip.on.c-adj{background:var(--red-soft); border-color:var(--red);}
  .chip.on.c-question{background:var(--gold-soft); border-color:var(--gold);}
  .chip.on.c-small{background:#E4E7EA; border-color:var(--muted);}
  .chip.on.c-pronoun{background:var(--plum-soft); border-color:var(--plum);}
  .chip.on.c-number{background:var(--teal-soft); border-color:var(--teal);}

  /* ---------- Stage / Card ---------- */
  .stage{
    min-height:420px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .empty-state{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:40px 24px;
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--muted);
    padding:0 4px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--line-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--ink);
    border-radius:999px;
    transition:width .25s ease;
  }

  .card-scene{
    perspective:1400px;
    flex:1;
  }
  .card{
    position:relative;
    min-height:300px;
    background:var(--paper);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:var(--shadow-lg);
    padding:28px 26px;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .card:active{ transform:scale(0.994); }

  .card-topline{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .cat-label{
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    font-weight:600;
  }
  .cat-label.c-verb{background:var(--blue-soft); color:var(--blue-dark);}
  .cat-label.c-noun{background:var(--green-soft); color:var(--green-dark);}
  .cat-label.c-adj{background:var(--red-soft); color:var(--red-dark);}
  .cat-label.c-question{background:var(--gold-soft); color:var(--gold-dark);}
  .cat-label.c-small{background:#E4E7EA; color:var(--muted);}
  .cat-label.c-pronoun{background:var(--plum-soft); color:var(--plum-dark);}
  .cat-label.c-number{background:var(--teal-soft); color:var(--teal-dark);}

  .box-dots{ display:flex; gap:3px; }
  .box-dots span{ width:6px;height:6px;border-radius:50%; background:var(--line);}
  .box-dots span.fill{ background:var(--ink); }

  .card-center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:14px 4px;
  }
  .prompt-lang{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .prompt-word{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(28px,7vw,42px);
    letter-spacing:-0.01em;
    line-height:1.1;
  }
  .prompt-sub{
    font-size:13.5px;
    color:var(--muted);
  }
  .flip-hint{
    font-size:12px;
    color:var(--muted-2);
    font-family:var(--font-mono);
  }

  .answer-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
  }
  .answer-word{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(26px,6.5vw,38px);
    color:var(--blue-dark);
  }
  .gender-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:600;
    color:#fff;
    flex:none;
  }
  .gender-badge.en{ background:var(--blue); border-radius:50%; }
  .gender-badge.ett{ background:var(--gold); border-radius:5px; }
  .gender-badge.none{ background:var(--muted-2); border-radius:5px; font-size:9px; }
  .answer-word-row{ display:flex; align-items:center; gap:10px; }

  .verb-chain{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:15px;
    color:var(--ink);
  }
  .verb-chain .arrow{ color:var(--muted-2); }
  .verb-chain .cell{
    background:var(--paper-2);
    border:1px solid var(--line-soft);
    border-radius:8px;
    padding:6px 10px;
  }
  .verb-chain .cell .lbl{
    display:block;
    font-size:9px;
    color:var(--muted-2);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:2px;
  }

  .example-line{
    font-size:13px;
    color:var(--muted);
    font-style:italic;
    margin-top:2px;
  }

  /* ---------- Action buttons ---------- */
  .action-row{
    display:flex;
    gap:10px;
  }
  .gbtn{
    flex:1;
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    padding:15px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease;
    box-shadow:var(--shadow);
  }
  .gbtn:active{ transform:scale(0.98); }
  .gbtn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .gbtn.good{ background:var(--green-soft); color:var(--green-dark); border-color:var(--green); }
  .gbtn.bad{ background:var(--red-soft); color:var(--red-dark); border-color:var(--red); }
  .gbtn.dontknow{ background:var(--paper-2); color:var(--muted); border-color:var(--line); font-size:13.5px; padding:15px 10px; }
  .gbtn.wide{ width:100%; }
  .gbtn:disabled{ opacity:.5; cursor:default; }

  .quiz-options{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width:520px){
    .quiz-options{ grid-template-columns:1fr 1fr; }
  }
  .quiz-opt{
    font-family:var(--font-body);
    font-size:15px;
    font-weight:500;
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    transition:all .12s ease;
  }
  .quiz-opt:hover:not(:disabled){ border-color:var(--ink); }
  .quiz-opt:disabled{ cursor:default; }
  .quiz-opt.correct{ background:var(--green-soft); border-color:var(--green); color:var(--green-dark); font-weight:600; }
  .quiz-opt.wrong{ background:var(--red-soft); border-color:var(--red); color:var(--red-dark); }
  .quiz-opt.dim{ opacity:.5; }

  .quiz-example{
    margin-top:14px;
    padding:12px 14px;
    background:var(--paper-2);
    border:1px solid var(--line-soft);
    border-radius:12px;
    flex-direction:column;
    gap:4px;
  }
  .quiz-example-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .quiz-example-text{
    font-family:var(--font-body);
    font-style:italic;
    font-size:14.5px;
    color:var(--ink);
    line-height:1.4;
  }
  .quiz-example-text-pl{
    font-family:var(--font-body);
    font-size:13px;
    color:var(--muted);
    line-height:1.4;
  }

  .type-input-row{
    margin-top:8px;
  }
  .type-input{
    width:100%;
    font-family:var(--font-body);
    font-size:17px;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .12s ease;
  }
  .type-input:focus{ border-color:var(--blue); }
  .type-input.correct{ border-color:var(--green); background:var(--green-soft); }
  .type-input.wrong{ border-color:var(--red); background:var(--red-soft); }
  .type-input:disabled{ opacity:1; }

  .gapfill-pl{
    font-family:var(--font-body);
    font-size:15px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:14px;
    padding:0 4px;
  }
  .gapfill-sentence{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(20px,5.5vw,28px);
    line-height:1.4;
    color:var(--ink);
  }
  .gap-blank{
    display:inline-block;
    color:var(--blue);
    border-bottom:2.5px solid var(--blue);
    padding:0 2px;
  }
  .gap-blank-correct{
    color:var(--green-dark);
    border-bottom-color:var(--green);
  }
  .gap-blank-wrong{
    color:var(--red-dark);
    border-bottom-color:var(--red);
  }

  .diacritic-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
    justify-content:center;
  }
  .diacritic-btn{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    width:36px;
    height:36px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
    cursor:pointer;
  }
  .diacritic-btn:active{ background:var(--line-soft); }

  .type-feedback{
    margin-top:12px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:14.5px;
    text-align:center;
    padding:10px 14px;
    border-radius:10px;
  }
  .type-feedback.good{ background:var(--green-soft); color:var(--green-dark); }
  .type-feedback.almost{ background:var(--gold-soft); color:var(--gold-dark); }
  .type-feedback.bad{ background:var(--red-soft); color:var(--red-dark); }

  .gender-choice{
    display:flex;
    gap:14px;
    justify-content:center;
  }
  .gender-choice .gc{
    flex:1;
    max-width:180px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:20px 12px;
    border-radius:16px;
    border:2px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    transition:all .12s ease;
  }
  .gender-choice .gc .shape{ width:34px;height:34px; }
  .gender-choice .gc.en .shape{ background:var(--blue); border-radius:50%; }
  .gender-choice .gc.ett .shape{ background:var(--gold); border-radius:7px; }
  .gender-choice .gc:hover{ border-color:var(--ink); }
  .gender-choice .gc.correct{ border-color:var(--green); background:var(--green-soft); }
  .gender-choice .gc.wrong{ border-color:var(--red); background:var(--red-soft); }
  .gender-choice .gc:disabled, .gender-choice .gc.disabled{ cursor:default; }

  .reveal-steps{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .reveal-steps button{
    font-family:var(--font-mono);
    font-size:12.5px;
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    color:var(--muted);
  }
  .reveal-steps button.done{
    background:var(--blue-soft);
    color:var(--blue-dark);
    border-color:var(--blue);
  }
  .reveal-steps button:disabled{ cursor:default; }

  /* ---------- End of session ---------- */
  .session-end{
    background:var(--paper);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:var(--shadow-lg);
    padding:40px 28px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .session-end .score{
    font-family:var(--font-display);
    font-weight:700;
    font-size:44px;
  }
  .session-end .score .of{ color:var(--muted-2); font-size:24px; }

  /* ---------- Stats page ---------- */
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  @media (min-width:520px){
    .stats-grid{ grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
  }
  .stat-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-card .v{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:24px;
  }
  .stat-card .l{
    font-size:11.5px;
    color:var(--muted);
    margin-top:4px;
    line-height:1.4;
  }

  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    margin:26px 4px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .cat-bar-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
  }
  .cat-bar-row .name{
    width:130px;
    flex:none;
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .cat-bar-row .name .dot{ width:8px;height:8px;border-radius:50%; flex:none;}
  .cat-bar-track{
    flex:1;
    height:8px;
    background:var(--line-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .cat-bar-fill{ height:100%; border-radius:999px; }
  .cat-bar-row .pct{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    width:38px;
    text-align:right;
    flex:none;
  }

  .box-hist{
    display:flex;
    gap:8px;
    align-items:flex-end;
    height:110px;
    padding:14px 16px 4px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .box-hist .col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    height:100%;
  }
  .box-hist .bar{
    width:100%;
    max-width:40px;
    background:var(--blue);

function buildWordList(){
  const words = [];
  verbsData.concat(verbsExtraData).forEach((v,i)=>{
    words.push({
      id:"v"+i, cat:"verb", pl:v[0], se:v[1],
      forms:{inf:v[1], pres:v[2], pret:v[3], sup:v[4]}
    });
  });
  nounsData.forEach((n,i)=>{
    words.push({ id:"n"+i, cat:"noun", pl:n[0], se:n[1], gender:n[2]||"" });
  });
  let ni=0;
  for(const group in nounGroupsData){
    nounGroupsData[group].forEach((n)=>{
      words.push({ id:"ng"+(ni++), cat:"noun", pl:n[0], se:n[1], gender:n[2]||"", sub:group });
    });
  }
  adjectivesData.forEach((a,i)=>{
    words.push({ id:"a"+i, cat:"adj", pl:a[0], se:a[1] });
  });
  let ai=0;
  for(const group in adjGroupsData){
    adjGroupsData[group].forEach((a)=>{
      words.push({ id:"ag"+(ai++), cat:"adj", pl:a[0], se:a[1], sub:group });
    });
  }
  questionsData.forEach((q,i)=>{
    words.push({ id:"q"+i, cat:"question", pl:q[0], se:q[1], example:q[2] });
  });
  let si=0;
  for(const group in smallData){
    smallData[group].forEach((s)=>{
      words.push({ id:"s"+(si++), cat:"small", pl:s[0], se:s[1], sub:group });
    });
  }
  smallGreetingsData.forEach((s)=>{
    words.push({ id:"s"+(si++), cat:"small", pl:s[0], se:s[1], sub:"Powitania i uprzejmości" });
  });
  smallPrepositionsExtra.forEach((s)=>{
    words.push({ id:"s"+(si++), cat:"small", pl:s[0], se:s[1], sub:"Przyimki" });
  });
  pronounsData.forEach((p,i)=>{
    words.push({ id:"pr"+i, cat:"pronoun", pl:p[0], se:p[1] });
  });
  let numi=0;
  for(const group in numberGroupsData){
    numberGroupsData[group].forEach((num)=>{
      words.push({ id:"num"+(numi++), cat:"number", pl:num[0], se:num[1], sub:group });
    });
  }
  // Attach Swedish + Polish example sentences, and the gap-fill blank
  // word, to every word. Question words already carry a Swedish example
  // from the source data, so for them we only need the Polish
  // translation and gap word (both keyed "question|<se>"); everything
  // else gets all three from the lookup tables.
  words.forEach(w=>{
    if(w.example){
      w.examplePl = EXAMPLE_SENTENCES_PL["question|"+w.se] || null;
      w.gapWord = GAP_WORDS["question|"+w.se] || null;
      return;
    }
    const key = w.sub ? w.cat+"|"+w.sub+"|"+w.se : w.cat+"|"+w.se;
    w.example = EXAMPLE_SENTENCES[key] || null;
    w.examplePl = EXAMPLE_SENTENCES_PL[key] || null;
    w.gapWord = GAP_WORDS[key] || null;
  });
  return words;
}

// ============================================================
// STORAGE
// Persistence is a nice-to-have, never a blocker. Two backends are
// tried in order:
//   1. Claude's cloud storage bridge (window.storage) — works when
//      the artifact has cloud persistence enabled.
//   2. Browser localStorage — works when this HTML file is opened
//      directly in a regular browser tab (e.g. downloaded and opened
//      outside Claude's sandboxed artifact view), which is a normal,
//      always-available browser feature independent of Claude.
// Reads get one quick retry (a missing key on a brand-new profile is
// normal, not an error). Writes get a couple of retries in the
// background. Either way the app keeps working from in-memory state
// without alarming the person using it, and the header quietly
// reflects which backend (if any) is actually saving.
// ============================================================
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

const LOCAL_STORAGE_PREFIX = "svenska-slownik:";
function localStorageAvailable(){
  try{
    const testKey = "__svenska_test__";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

async function waitForStorageBridge(timeoutMs){
  const start = Date.now();
  while(typeof window.storage === "undefined" && Date.now()-start < timeoutMs){
    await sleep(100);
  }
  return typeof window.storage !== "undefined";
}

async function storageGetSafe(key){
  if(typeof window.storage !== "undefined"){
    for(let attempt=0; attempt<2; attempt++){
      try{
        const r = await window.storage.get(key, false);
        return (r && typeof r.value === "string") ? r.value : null;
      }catch(e){
        // A missing key throws too, so this is often expected (e.g. first-ever run).
        if(attempt===1) break; // give localStorage a chance below instead of giving up
        await sleep(150);
      }
    }
  }
  if(localStorageAvailable()){
    try{ return window.localStorage.getItem(LOCAL_STORAGE_PREFIX+key); }
    catch(e){ return null; }
  }
  return null;
}

// Returns { ok, mode } where mode is 'cloud' | 'local' | null.
async function storageSetSafe(key, value){
  if(typeof window.storage !== "undefined"){
    for(let attempt=0; attempt<3; attempt++){
      try{
        await window.storage.set(key, value, false);
        return { ok:true, mode:"cloud" };
      }catch(e){
        if(attempt<2) await sleep(200*(attempt+1));
      }
    }
  }
  if(localStorageAvailable()){
    try{
      window.localStorage.setItem(LOCAL_STORAGE_PREFIX+key, value);
      return { ok:true, mode:"local" };
    }catch(e){ /* fall through */ }
  }
  console.warn("Zapis storage nieudany dla", key, "— postęp zostanie tylko w tej sesji.");
  return { ok:false, mode:null };
}

// Re-renders (cheap, idempotent) only if the persistence mode actually
// changed, so the header note stays accurate without disrupting
// whatever the person is doing mid-session.
function reportPersistenceResult(result){
  const changed = result.mode !== state.persistenceMode;
  state.persistenceMode = result.mode;
  state.persistenceOK = result.ok;
  if(changed && state.storageReady) render();
}

async function loadState(){
  const bridgeFound = await waitForStorageBridge(1500);

  const [p, s] = await Promise.all([
    storageGetSafe("progress-v1"),
    storageGetSafe("settings-v1"),
  ]);
  if(p){ try{ state.progress = JSON.parse(p); }catch(e){ state.progress = {}; } }
  if(s){ try{ state.settings = Object.assign(state.settings, JSON.parse(s)); }catch(e){ /* keep defaults */ } }

  // Best-effort guess for the initial header state before the first
  // save round-trip confirms which backend actually works; a save
  // shortly after (e.g. answering something, see recordActivityForStreak)
  // will correct it.
  state.persistenceMode = bridgeFound ? "cloud" : (localStorageAvailable() ? "local" : null);
  state.persistenceOK = state.persistenceMode !== null;

  state.storageReady = true;
  // Note: the streak is intentionally NOT bumped here (see
  // recordActivityForStreak, only triggered by real answers). But we
  // still do one lightweight settings save now, purely to let the
  // header's "where is this actually saving" note self-correct quickly
  // if the optimistic cloud/local guess above turns out to be wrong —
  // this write doesn't touch the streak or activity counters at all.
  saveSettings();
}

let saveProgressTimer = null;
function saveProgress(){
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(async ()=>{
    const result = await storageSetSafe("progress-v1", JSON.stringify(state.progress));
    reportPersistenceResult(result);
  }, 250);
}
async function saveSettings(){
  const result = await storageSetSafe("settings-v1", JSON.stringify(state.settings));
  reportPersistenceResult(result);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

// Minimum number of answered exercises (any mode, any dimension) in a
// day before that day counts toward the streak — so opening the app
// and immediately closing it again no longer "counts" as a study day.
const STREAK_MIN_ACTIVITY = 5;

// Pure calculation, no I/O — returns true if streak state changed.
function bumpStreakForToday(){
  const today = todayStr();
  const last = state.settings.lastActiveDate;
  if(last === today) return false;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  if(last === yesterday){ state.settings.streak = (state.settings.streak||0)+1; }
  else{ state.settings.streak = 1; }
  state.settings.bestStreak = Math.max(state.settings.bestStreak||0, state.settings.streak);
  state.settings.lastActiveDate = today;
  return true;
}

// Called from markResult on every answered exercise. Tracks how many
// exercises have been answered today; once the threshold is crossed,
// bumps the streak exactly once for that day.
function recordActivityForStreak(){
  const today = todayStr();
  if(state.settings.activityDate !== today){
    state.settings.activityDate = today;
    state.settings.activityCount = 0;
  }
  state.settings.activityCount = (state.settings.activityCount||0) + 1;
  if(state.settings.lastActiveDate !== today && state.settings.activityCount >= STREAK_MIN_ACTIVITY){
    bumpStreakForToday();
    saveSettings();
  }
}

// ============================================================
// PROGRESS HELPERS
// ============================================================
// Progress is tracked per "dimension" so that different skills don't
// contaminate each other's spaced-repetition scheduling:
//  - 'main'      -> flashcards + quiz (both test PL<->SE recall)
//  - 'gender'    -> Rodzajniki drill (en/ett recall specifically)
//  - 'verbchain' -> Odmiana czasowników drill (full conjugation recall)
//  - 'typing'    -> Zdania z luką drill (producing the word in context)
// Getting a noun right in Flashcards says nothing about whether you
// know its gender, so gender scheduling must not be influenced by it,
// and vice versa.
//
// On top of that, each dimension now uses real spaced-repetition due
// dates (today → 1d → 3d → 7d → 14d → 30d → 60d), not just weighting:
// a wrong answer is due again immediately, a right answer schedules
// the next review further out each time. A session first fills up
// with whatever's actually due, then tops up with weighted picks from
// the rest (favouring low boxes) so a session is never short even
// early on when little has a schedule yet.
// ============================================================
const DIM_BOX_FIELD =      { main:"box",      gender:"genderBox",      verbchain:"verbBox",      typing:"typingBox" };
const DIM_SEEN_FIELD =     { main:"seen",     gender:"genderSeen",     verbchain:"verbSeen",     typing:"typingSeen" };
const DIM_CORRECT_FIELD =  { main:"correct",  gender:"genderCorrect",  verbchain:"verbCorrect",  typing:"typingCorrect" };
const DIM_DUE_FIELD =      { main:"dueMain",  gender:"dueGender",      verbchain:"dueVerbchain", typing:"dueTyping" };
const DIM_INTERVAL_FIELD = { main:"ivlMain",  gender:"ivlGender",      verbchain:"ivlVerbchain", typing:"ivlTyping" };

// Interval ladder in days. Index advances by 1 on each correct answer
// (capped at the end), resets to 0 on any wrong answer.
const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30, 60];
const DAY_MS = 24*60*60*1000;

function getP(id){
  return state.progress[id] || { box:0, seen:0, correct:0, incorrect:0 };
}
// markResult accepts either a boolean (existing call sites: Fiszki,
// Quiz, Rodzajniki, Odmiana czasowników — these only ever have a
// right/wrong outcome) or a tier string 'exact' | 'almost' | 'wrong'
// (Zdania z luką, which can also produce a near-miss). This matters
// because a spelling slip ("almost") must NOT earn the same long
// interval jump as a flawless answer — otherwise a typo gets rewarded
// exactly like perfect recall, which quietly inflates "mastered" and
// pushes the word further out than it's actually earned.
function markResult(id, tierOrBool, dimension){
  dimension = dimension || "main";
  const tier = typeof tierOrBool === "boolean" ? (tierOrBool ? "exact" : "wrong") : tierOrBool;
  const p = getP(id);
  const boxField = DIM_BOX_FIELD[dimension];
  const seenField = DIM_SEEN_FIELD[dimension];
  const correctField = DIM_CORRECT_FIELD[dimension];
  const dueField = DIM_DUE_FIELD[dimension];
  const intervalField = DIM_INTERVAL_FIELD[dimension];
  const now = Date.now();

  p[seenField] = (p[seenField]||0)+1;

  if(tier === "exact"){
    p[correctField] = (p[correctField]||0)+1;
    p[boxField] = Math.min((p[boxField]||0)+1, 4);
    const nextIdx = Math.min((p[intervalField]||0)+1, INTERVAL_DAYS.length-1);
    p[intervalField] = nextIdx;
    p[dueField] = now + INTERVAL_DAYS[nextIdx]*DAY_MS;
  } else if(tier === "almost"){
    // Still a genuine recall (right word, imperfect spelling), so it
    // counts toward accuracy — but box doesn't advance (no mastery
    // credit for a typo) and the next review stays close (tomorrow),
    // not the long jump a clean answer would earn.
    p[correctField] = (p[correctField]||0)+1;
    p.almostCount = (p.almostCount||0)+1;
    p[intervalField] = 1;
    p[dueField] = now + INTERVAL_DAYS[1]*DAY_MS;
  } else {
    p.incorrect = (p.incorrect||0)+1;
    p[boxField] = 0;
    p[intervalField] = 0;
    p[dueField] = now; // due again right away
  }
  p.lastSeen = now;
  state.progress[id] = p;
  recordActivityForStreak();
  saveProgress();
}

function pickWeightedSession(pool, n, dimension){
  dimension = dimension || "main";
  const boxField = DIM_BOX_FIELD[dimension];
  const dueField = DIM_DUE_FIELD[dimension];
  const now = Date.now();

  const due = [];
  const notDue = [];
  pool.forEach(w=>{
    const p = getP(w.id);
    const dueTs = p[dueField];
    if(dueTs===undefined || dueTs<=now) due.push(w);
    else notDue.push(w);
  });

  // Shuffle the due list (Fisher–Yates) and take up to n of them first —
  // words that are actually due (including never-seen-before words)
  // always come before words that aren't due yet.
  for(let i=due.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [due[i],due[j]] = [due[j],due[i]];
  }
  let session = due.slice(0, n);

  if(session.length < n){
    const remaining = n - session.length;
    const items = notDue.map(w=>{
      const p = getP(w.id);
      const box = Math.min(p[boxField]||0,4);
      return { w, weight: Math.pow(2, 4-box) };
    });
    const cnt = Math.min(remaining, items.length);
    for(let i=0;i<cnt;i++){
      const total = items.reduce((s,it)=>s+it.weight,0);
      let r = Math.random()*total, acc=0, idx=0;
      for(let j=0;j<items.length;j++){ acc+=items[j].weight; if(r<=acc){ idx=j; break; } }
      session.push(items[idx].w);
      items.splice(idx,1);
    }
  }
  return session;
}

function renderFlashOrQuizChrome(host, mode){
  let pool = filteredPool();
  if(mode==="quiz"){
    // "inne" (= "wewnątrz"/indoors) reads to a Polish speaker exactly like the
    // meta-word "inne" (= "other"), so as a clickable quiz option it looks like
    // a "none of the above" trap even when it's the correct answer. Keep the
    // word in Fiszki/other modes where there's no such ambiguity, but leave it
    // out of Quiz entirely — as a target and as a distractor.
    pool = pool.filter(w=>!QUIZ_EXCLUDED_SE.has(w.se));
  }
  host.innerHTML = `
    <div class="toprow-controls">
      ${dirToggleHTML()}
    </div>
    ${chipRowHTML()}
    <div class="stage" id="stage-inner"></div>
  `;
  bindDirToggle(()=>{ resetSessionForMode(); renderStageHost(); });
  bindChipRow(()=>{ resetSessionForMode(); renderStageHost(); });

  const stage = document.getElementById("stage-inner");
  if(pool.length===0){
    stage.innerHTML = `<div class="empty-state">Wybierz przynajmniej jedną kategorię, aby zacząć.</div>`;
    return;
  }
  if(state.session.length===0){
    state.session = pickWeightedSession(pool, SESSION_SIZE, "main").map(w=>w.id);
    state.idx = 0; state.flipped=false; state.quizLocked=false; state.score={correct:0,total:0};
  }
  if(state.idx >= state.session.length){
    return renderSessionEnd(stage, mode);
  }
  if(mode==="flash") renderFlashCard(stage);
  else renderQuizCard(stage);
}

function progressRowHTML(){
  const total = state.session.length;
  const cur = Math.min(state.idx+1, total);
  const pct = total? Math.round((state.idx/total)*100) : 0;
  return `<div class="progress-row">
    <span>${cur}/${total}</span>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span>${state.score.correct}/${state.score.total} ✓</span>
  </div>`;
}

function boxDotsHTML(id, dimension){
  const boxField = DIM_BOX_FIELD[dimension || "main"];
  const box = Math.min(getP(id)[boxField]||0,4);
  const fillCount = box>=4 ? 5 : box; // mastered = a full row, not 4/5
  let out = '<div class="box-dots">';
  for(let i=0;i<5;i++) out += `<span class="${i<fillCount?'fill':''}"></span>`;
  return out+"</div>";
}

let keyHandlerBound = false;
function globalKeyHandler(e){
  if(state.mode!=="flash") return;
  if(state.idx >= state.session.length) return;
  if(e.code==="Space"){ e.preventDefault(); if(!state.flipped){ state.flipped=true; renderStageHost(); } }
  if(state.flipped){
    if(e.code==="ArrowRight"){ answerFlash(true); }
    if(e.code==="ArrowLeft"){ answerFlash(false); }
  }
}

function flashAnswerHTML(w){
  // The card front already showed one language (per state.direction);
  // the back must make the OTHER language the prominent "answer" —
  // previously this was hardcoded to always show SE big/PL small,
  // which was wrong half the time (SE→PL showed the Swedish word
  // again instead of the Polish answer being tested).
  const isPlToSe = state.direction === "pl-se";
  const frontText = isPlToSe ? w.pl : w.se; // already visible before flip
  const answerText = isPlToSe ? w.se : w.pl; // what's actually being tested

  if(w.cat==="verb"){
    const chainHtml = `
      <div class="verb-chain">
        <div class="cell"><span class="lbl">Bezokolicznik</span>${w.forms.inf}</div>
        <span class="arrow">→</span>
        <div class="cell"><span class="lbl">Teraz</span>${w.forms.pres}</div>
        <span class="arrow">→</span>
        <div class="cell"><span class="lbl">Preteritum</span>${w.forms.pret}</div>
        <span class="arrow">→</span>
        <div class="cell"><span class="lbl">Supinum</span>${w.forms.sup}</div>
      </div>
    `;
    // The conjugation chain is itself the full Swedish answer, so it stays
    // prominent either way; only the top label changes with direction.
    return isPlToSe
      ? `<div class="prompt-lang">${frontText}</div>${chainHtml}`
      : `<div class="answer-word">${answerText}</div>${chainHtml}`;
  }
  if(w.cat==="noun"){
    if(isPlToSe){
      return `
        <div class="prompt-lang">${frontText}</div>
        <div class="answer-word-row">
          ${genderBadgeHTML(w.gender)}
          <div class="answer-word">${w.gender?w.gender+" ":""}${w.se}</div>
        </div>
        ${!w.gender ? '<div class="prompt-sub">rzeczownik zwykle bez rodzajnika nieokreślonego</div>' : ''}
      `;
    }
    return `
      <div class="answer-word">${answerText}</div>
      <div class="answer-word-row">
        ${genderBadgeHTML(w.gender)}
        <div class="prompt-sub">${w.gender?w.gender+" ":""}${w.se}</div>
      </div>
    `;
  }
  return `
    <div class="prompt-lang">${frontText}</div>
    <div class="answer-word">${answerText}</div>
    ${w.example ? `<div class="example-line">„${w.example}"</div>` : ''}
  `;
}

function genderBadgeHTML(g){
  if(g==="en") return `<span class="gender-badge en">en</span>`;
  if(g==="ett") return `<span class="gender-badge ett">ett</span>`;
  return `<span class="gender-badge none">–</span>`;
}

function answerFlash(correct, dontKnow){
  const w = WORD_BY_ID[state.session[state.idx]];
  markResult(w.id, correct, "main");
  if(dontKnow){
    const p = getP(w.id);
    p.dontKnowCount = (p.dontKnowCount||0)+1;
    state.progress[w.id] = p;
    saveProgress();
  }
  state.score.total++;
  if(correct) state.score.correct++;
  state.idx++;
  state.flipped=false;
  renderStageHost();
}

// ---------------- QUIZ ----------------
function buildQuizOptions(w){
  const isPlToSe = state.direction==="pl-se";
  const correctText = isPlToSe ? w.se : w.pl;

  // Prefer distractors from the same subgroup (e.g. prepositions vs.
  // prepositions, not prepositions vs. time-words) so wrong options are
  // plausible enough to actually test understanding. Falls back to the
  // whole category, then the whole dictionary, if a pool is too small.
  const notExcludedNotSelf = o => o.id!==w.id && !QUIZ_EXCLUDED_SE.has(o.se);
  let pool = w.sub
    ? ALL_WORDS.filter(o=>o.cat===w.cat && o.sub===w.sub && notExcludedNotSelf(o))
    : ALL_WORDS.filter(o=>o.cat===w.cat && notExcludedNotSelf(o));
  if(pool.length<3) pool = ALL_WORDS.filter(o=>o.cat===w.cat && notExcludedNotSelf(o));
  if(pool.length<3) pool = ALL_WORDS.filter(notExcludedNotSelf);

  const seen = new Set([correctText]);
  const distractors = [];
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  for(const o of shuffled){
    const t = isPlToSe ? o.se : o.pl;
    if(seen.has(t)) continue;
    seen.add(t);
    distractors.push(t);
    if(distractors.length===3) break;
  }
  // Extremely defensive fallback: if the subgroup/category pool somehow
  // couldn't fill 3 unique distractors (shouldn't happen at this dataset's
  // size, but never show a quiz with fewer than 4 options), top up from
  // the whole dictionary.
  if(distractors.length<3){
    const wholeShuffled = ALL_WORDS.filter(notExcludedNotSelf).sort(()=>Math.random()-0.5);
    for(const o of wholeShuffled){
      const t = isPlToSe ? o.se : o.pl;
      if(seen.has(t)) continue;
      seen.add(t);
      distractors.push(t);
      if(distractors.length===3) break;
    }
  }
  const options = [correctText, ...distractors].sort(()=>Math.random()-0.5);
  return { correctText, options };
}

function renderQuizCard(stage){
  const w = WORD_BY_ID[state.session[state.idx]];

        state.idx++;

}

// ============================================================
// TYPING DRILL — answer-matching helpers
// Tiered so a person isn't unfairly marked wrong for a keyboard
// that lacks å/ä/ö or Polish diacritics, while still teaching
// correct spelling: exact match, then diacritic-insensitive /
// small-typo match ("almost"), then genuinely wrong.
// ============================================================
const DIACRITIC_MAP = {
  "å":"a","ä":"a","ö":"o","é":"e","ü":"u",
  "ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z",
};
function stripDiacritics(s){
  return s.split("").map(ch=>DIACRITIC_MAP[ch]||ch).join("");
}
function normalizeAnswer(s){
  return s
    .toLowerCase()
    .trim()
    .replace(/\([^)]*\)/g, "")   // drop parenthetical notes, e.g. "który? (en)" -> "który?"
    .replace(/[?!.,]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
// Returns {tier: 'exact'|'almost'|'wrong', matchedCandidate}
function evaluateTypedAnswer(userInput, correctRaw){
  const candidates = correctRaw.split("/").map(c=>c.trim());
  const userNorm = normalizeAnswer(userInput);
  if(!userNorm) return { tier:"wrong", matchedCandidate: candidates[0] };

  for(const c of candidates){
    if(userNorm === normalizeAnswer(c)) return { tier:"exact", matchedCandidate:c };
  }
  for(const c of candidates){
    const cNorm = normalizeAnswer(c);
    const userNoDia = stripDiacritics(userNorm);
    const cNoDia = stripDiacritics(cNorm);
    if(userNoDia === cNoDia) return { tier:"almost", matchedCandidate:c };
    const tolerance = cNoDia.length >= 6 ? 2 : 1;
    if(levenshtein(userNoDia, cNoDia) <= tolerance) return { tier:"almost", matchedCandidate:c };
  }
  return { tier:"wrong", matchedCandidate: candidates[0] };
}

function renderGapFillMode(host){
  const pool = filteredPool().filter(w=>w.gapWord && w.example);
  host.innerHTML = `
    ${chipRowHTML()}
    <div class="subtab-hint">Uzupełnij brakujące słowo po szwedzku — kontekst (polskie tłumaczenie) pokazuje, o co chodzi.</div>
    <div class="stage" id="stage-inner"></div>
  `;
  bindChipRow(()=>{ resetSessionForMode(); renderStageHost(); });

  const stage = document.getElementById("stage-inner");
  if(pool.length===0){
    stage.innerHTML = `<div class="empty-state">Wybierz przynajmniej jedną kategorię, aby zacząć.</div>`;
    return;
  }
  if(state.session.length===0){
    state.session = pickWeightedSession(pool, SESSION_SIZE, "typing").map(w=>w.id);
    state.idx = 0; state.quizLocked=false; state.score={correct:0,total:0};
  }
  if(state.idx >= state.session.length){
    return renderSessionEnd(stage, "type");
  }
  renderGapFillCard(stage);
}

function splitSentenceAtGap(sentence, gapText){
  const idx = sentence.indexOf(gapText);
  if(idx===-1) return null;
  return { before: sentence.slice(0,idx), after: sentence.slice(idx+gapText.length) };
}

function renderGapFillCard(stage){
  const w = WORD_BY_ID[state.session[state.idx]];
  const meta = CAT_META[w.cat];
  const split = splitSentenceAtGap(w.example, w.gapWord);
  const diacriticSet = ["å","ä","ö"];

  stage.innerHTML = `
    ${progressRowHTML()}
    <div class="card-scene">
      <div class="card" style="cursor:default">
        <div class="card-topline">
          <span class="cat-label ${meta.cls}">${meta.label}${w.sub?" · "+w.sub:""}</span>
          ${boxDotsHTML(w.id, "typing")}
        </div>
        <div class="card-center">
          <div class="prompt-lang">Polski</div>
          <div class="gapfill-pl">${w.examplePl || w.pl}</div>
          <div class="gapfill-sentence" id="gapfill-sentence">${split
            ? `${split.before}<span class="gap-blank" id="gap-blank">______</span>${split.after}`
            : w.example}</div>
        </div>
        <div class="type-input-row">
          <input type="text" id="type-input" class="type-input"
            placeholder="Brakujące słowo..."
            autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
        </div>
        <div class="diacritic-row" id="diacritic-row">
          ${diacriticSet.map(ch=>`<button class="diacritic-btn" data-ch="${ch}">${ch}</button>`).join("")}
        </div>
        <div class="type-feedback" id="type-feedback" style="display:none"></div>
      </div>
    </div>
    <div class="action-row" id="type-action-row">
      <button class="gbtn primary wide" id="btn-type-check">Sprawdź</button>
    </div>
  `;

  const input = document.getElementById("type-input");
  input.focus();

  document.querySelectorAll(".diacritic-btn").forEach(btn=>{
    btn.onclick = ()=>{
      if(state.quizLocked) return;
      const ch = btn.dataset.ch;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = input.value.slice(0,start) + ch + input.value.slice(end);
      input.focus();
      input.selectionStart = input.selectionEnd = start + ch.length;
    };
  });

  function submit(){
    if(state.quizLocked) return;
    state.quizLocked = true;
    const userInput = input.value;
    const { tier, matchedCandidate } = evaluateTypedAnswer(userInput, w.gapWord);
    const correct = tier !== "wrong";

    input.disabled = true;
    input.classList.add(tier==="wrong" ? "wrong" : "correct");

    const gapEl = document.getElementById("gap-blank");
    if(gapEl){
      gapEl.textContent = w.gapWord;
      gapEl.classList.add(tier==="wrong" ? "gap-blank-wrong" : "gap-blank-correct");
    }

    const feedbackEl = document.getElementById("type-feedback");
    feedbackEl.style.display = "block";
    if(tier==="exact"){
      feedbackEl.className = "type-feedback good";
      feedbackEl.textContent = "Świetnie!";
    } else if(tier==="almost"){
      feedbackEl.className = "type-feedback almost";
      feedbackEl.textContent = `Prawie dobrze — poprawna pisownia: ${matchedCandidate}`;
    } else {
      feedbackEl.className = "type-feedback bad";
      feedbackEl.textContent = `Poprawna odpowiedź: ${w.gapWord}`;
    }

    markResult(w.id, tier, "typing");
    state.score.total++;
    if(correct) state.score.correct++;

    document.getElementById("type-action-row").innerHTML =
      `<button class="gbtn primary wide" id="btn-type-next">Dalej</button>`;
    document.getElementById("btn-type-next").onclick = ()=>{
      state.idx++;
      state.quizLocked = false;
      renderStageHost();
    };
  }

  document.getElementById("btn-type-check").onclick = submit;
  input.addEventListener("keydown", (e)=>{
    if(e.key==="Enter"){ e.preventDefault(); submit(); }
  });
}

      });
      markResult(w.id, correct, "gender");
      state.score.total++;
      if(correct) state.score.correct++;
      document.getElementById("gender-next-row").style.display="flex";
      document.getElementById("btn-gender-next").onclick = ()=>{
        state.idx++; state.quizLocked=false; renderStageHost();
      };
    };
  });
}
function renderGenderEnd(stage){ renderSessionEnd(stage, "gender"); }

// ============================================================
// VERB CHAIN DRILL
// ============================================================
const VERB_STEPS = [
  { key:"pres", label:"Teraz" },
  { key:"pret", label:"Preteritum" },
  { key:"sup",  label:"Supinum" },
];
function renderVerbChainMode(host){
  const pool = ALL_WORDS.filter(w=>w.cat==="verb");
  host.innerHTML = `
    <div class="subtab-hint">Zobacz bezokolicznik i znaczenie, spróbuj przypomnieć sobie resztę form w rytmie: <b>bezokolicznik → teraz → preteritum → supinum</b>.</div>
    <div class="stage" id="stage-inner"></div>
  `;
  const stage = document.getElementById("stage-inner");
  if(state.session.length===0){
    state.session = pickWeightedSession(pool, SESSION_SIZE, "verbchain").map(w=>w.id);
    state.idx=0; state.revealStep=0; state.score={correct:0,total:0};
  }
  if(state.idx>=state.session.length) return renderSessionEnd(stage, "verbchain");
  renderVerbChainCard(stage);
}
function renderVerbChainCard(stage){
  const w = WORD_BY_ID[state.session[state.idx]];
  const step = state.revealStep;
  stage.innerHTML = `
    ${progressRowHTML()}
    <div class="card-scene">
      <div class="card" style="cursor:default">
        <div class="card-topline">
          <span class="cat-label c-verb">Czasownik</span>
          ${boxDotsHTML(w.id, "verbchain")}
        </div>
        <div class="card-center">
          <div class="prompt-lang">${w.pl}</div>
          <div class="verb-chain">
            <div class="cell"><span class="lbl">Bezokolicznik</span>${w.forms.inf}</div>
            ${VERB_STEPS.map((s,i)=>`
              <span class="arrow">→</span>
              <div class="cell">
                <span class="lbl">${s.label}</span>${i < step ? w.forms[s.key] : '···'}
              </div>
            `).join("")}
          </div>
        </div>
        ${step < 3 ? `
          <div class="reveal-steps">
            <button id="btn-reveal">Odkryj: ${VERB_STEPS[step].label}</button>
          </div>
        ` : `
          <div class="action-row">
            <button class="gbtn bad" id="btn-no">Nie umiem</button>
            <button class="gbtn good" id="btn-yes">Umiem</button>
          </div>
        `}
      </div>
    </div>
  `;
  const revealBtn = document.getElementById("btn-reveal");
  if(revealBtn) revealBtn.onclick = ()=>{ state.revealStep++; renderStageHost(); };
  const yesBtn = document.getElementById("btn-yes");
  const noBtn = document.getElementById("btn-no");
  if(yesBtn) yesBtn.onclick = ()=>{ answerVerbChain(true); };
  if(noBtn) noBtn.onclick = ()=>{ answerVerbChain(false); };
}
function answerVerbChain(correct){
  const w = WORD_BY_ID[state.session[state.idx]];
  markResult(w.id, correct, "verbchain");
  state.score.total++;
  if(correct) state.score.correct++;
  state.idx++;
  state.revealStep=0;
  renderStageHost();
}

// ============================================================
// STATS
// ============================================================
function renderStats(host){
  const totalMastered = ALL_WORDS.filter(w=>getP(w.id).box>=4).length;
  // "Practiced" means practiced in ANY mode — not just Fiszki/Quiz —
  // otherwise a word drilled only in Rodzajniki or Odmiana czasowników
  // would look untouched here even though real work happened on it.
  const attempted = ALL_WORDS.filter(w=>{
    const p = getP(w.id);
    return (p.seen||0)>0 || (p.genderSeen||0)>0 || (p.verbSeen||0)>0 || (p.typingSeen||0)>0;
  }).length;
  const boxCounts = [0,0,0,0,0];
  ALL_WORDS.forEach(w=>{ boxCounts[Math.min(getP(w.id).box||0,4)]++; });
  const maxBox = Math.max(...boxCounts,1);

  // Accuracy for the two specialist drills, isolated to only what was
  // actually practiced *in that drill* — not contaminated by flashcard
  // or quiz answers on the same words (see markResult dimensions).
  function accFor(pool, seenField, correctField){
    let c=0,t=0;
    pool.forEach(w=>{ const p=getP(w.id); c+=p[correctField]||0; t+=p[seenField]||0; });
    return t? Math.round((c/t)*100) : null;
  }
  const genderPool = ALL_WORDS.filter(w=>w.cat==="noun" && (w.gender==="en"||w.gender==="ett"));
  const genderAcc = accFor(genderPool, "genderSeen", "genderCorrect");
  const verbPool = ALL_WORDS.filter(w=>w.cat==="verb");
  const verbAcc = accFor(verbPool, "verbSeen", "verbCorrect");
  const typingAcc = accFor(ALL_WORDS, "typingSeen", "typingCorrect");

  host.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="v">${ALL_WORDS.length}</div><div class="l">słów łącznie</div></div>
      <div class="stat-card"><div class="v">${attempted}</div><div class="l">przećwiczonych</div></div>
      <div class="stat-card"><div class="v">${totalMastered}</div><div class="l">opanowanych</div></div>
      <div class="stat-card"><div class="v">${genderAcc===null?'–':genderAcc+'%'}</div><div class="l">celność en/ett<br>(w Rodzajnikach)</div></div>
      <div class="stat-card"><div class="v">${verbAcc===null?'–':verbAcc+'%'}</div><div class="l">celność odmiany<br>(w trenerze czasowników)</div></div>
      <div class="stat-card"><div class="v">${typingAcc===null?'–':typingAcc+'%'}</div><div class="l">celność pisania<br>(we Wpisywaniu)</div></div>
    </div>

    <div class="section-title">Postęp wg kategorii</div>
    ${CATS.map(c=>{
      const meta = CAT_META[c];
      const words = ALL_WORDS.filter(w=>w.cat===c);
      const mastered = words.filter(w=>getP(w.id).box>=4).length;
      const pct = Math.round((mastered/words.length)*100);
      return `<div class="cat-bar-row">
        <div class="name"><span class="dot" style="background:${meta.color}"></span>${meta.label}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${meta.color}"></div></div>
        <div class="pct">${mastered}/${words.length}</div>
      </div>`;
    }).join("")}

    <div class="section-title">Rozkład powtórek (pudełka Leitnera)</div>
    <div class="box-hist">
      ${boxCounts.map((c,i)=>`
        <div class="col">
          <div class="bar" style="height:${Math.max((c/maxBox)*90,3)}px"></div>
          <div class="lbl">${c}</div>
        </div>
      `).join("")}
    </div>
    <div class="progress-row" style="padding-top:4px;">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--muted-2)">nowe → stopniowo opanowane (0 → 4), na podstawie Fiszek i Quizu</span>
    </div>

    <div class="reset-row">
      <button class="link-btn" id="btn-reset">Wyczyść cały postęp</button>
    </div>
  `;
  document.getElementById("btn-reset").onclick = showResetModal;
}

function showResetModal(){
  const div = document.createElement("div");
  div.className = "modal-backdrop";
  div.innerHTML = `
    <div class="modal">
      <div class="prompt-word" style="font-size:20px;">Wyczyścić postęp?</div>
      <p>Ta operacja usunie wszystkie zapisane wyniki dla ${ALL_WORDS.length} słów. Nie można jej cofnąć.</p>
      <div class="row">
        <button class="gbtn wide" id="modal-cancel">Anuluj</button>
        <button class="gbtn bad wide" id="modal-confirm">Wyczyść</button>
      </div>
    </div>
  `;
  document.body.appendChild(div);
  document.getElementById("modal-cancel").onclick = ()=>div.remove();
  div.onclick = (e)=>{ if(e.target===div) div.remove(); };
  document.getElementById("modal-confirm").onclick = async ()=>{
    state.progress = {};
    await storageSetSafe("progress-v1", JSON.stringify({}));
    div.remove();
    renderStageHost();
  };
}

// ============================================================
// INIT
// ============================================================
(async function init(){
  await loadState();
  render();
})();

</script>
</body>
</html>
